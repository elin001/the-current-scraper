name: Monthly playlist scrape

on:
  schedule:
    # 12:37 UTC on the 1st of each month (6–7am Central), so the previous month is complete.
    # Off the top of the hour on purpose: MusicBrainz asks clients not to fire at synchronized times.
    - cron: "37 12 1 * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # to commit the updated data/plays/*.parquet and enrichment tables

concurrency:
  group: monthly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests pandas pyarrow tqdm truststore

      - name: Scrape from last saved date through yesterday
        id: scrape
        run: python scraper.py --update
        env:
          TQDM_MININTERVAL: "30" # keep the Actions log readable

      - name: Enrich new songs/artists from MusicBrainz + Wikidata
        id: enrich
        # Only fetches album/artist IDs that aren't cached yet, then rebuilds the song/artist tables.
        # --jitter waits a random 0–15 min first. A MusicBrainz outage shouldn't block committing plays.
        if: always() && steps.scrape.outcome != 'skipped'
        continue-on-error: true
        run: python enrich.py update --jitter
        env:
          TQDM_MININTERVAL: "30"

      - name: Commit new data
        # Commit even if the scrape stopped early, so partial progress is kept;
        # the next run resumes from the first missing day.
        if: always() && steps.scrape.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/plays
          for f in data/musicbrainz data/songs.parquet data/artists.parquet; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            THROUGH=$(python -c "import scraper; print(scraper.last_saved_date())")
            git commit -m "Monthly scrape: plays through $THROUGH"
            git push
          fi

      - name: Upload scrape log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs
          path: |
            data/scrape.log
            data/failed_dates.txt
            data/enrich.log
          if-no-files-found: ignore
          retention-days: 30
