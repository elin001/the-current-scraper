name: Monthly playlist scrape

on:
  schedule:
    # 12:00 UTC on the 1st of each month (6–7am Central), so the previous month is complete.
    - cron: "0 12 1 * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # to commit the updated data/plays/*.parquet

concurrency:
  group: monthly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests pandas pyarrow tqdm truststore

      - name: Scrape from last saved date through yesterday
        id: scrape
        run: python scraper.py --update
        env:
          TQDM_MININTERVAL: "30" # keep the Actions log readable

      - name: Commit new data
        # Commit even if the scrape stopped early, so partial progress is kept;
        # the next run resumes from the first missing day.
        if: always() && steps.scrape.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/plays
          if git diff --cached --quiet; then
            echo "No new plays to commit."
          else
            THROUGH=$(python -c "import scraper; print(scraper.last_saved_date())")
            git commit -m "Monthly scrape: plays through $THROUGH"
            git push
          fi

      - name: Upload scrape log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: |
            data/scrape.log
            data/failed_dates.txt
          if-no-files-found: ignore
          retention-days: 30
